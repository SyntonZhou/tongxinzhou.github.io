intro:
  headline:
    en: "Computer architecture and hardware–software co-design"
    zh: "计算机体系结构与软硬件协同设计"
  affiliation:
    en: "Master’s student, School of Integrated Circuits, Nanjing University"
    zh: "南京大学集成电路学院硕士研究生"
  summary:
    en: "I work on RISC-V processor design and hardware–software co-design for edge inference. I am interested in how memory organization and data movement shape processor architecture, particularly in processing-in-memory and 3D-integrated systems."
    zh: "我目前从事 RISC-V 处理器设计与边缘推理的软硬件协同研究，关注存储组织与数据搬运如何影响处理器架构，尤其对存算一体与三维集成感兴趣。"
  advisor:
    en: "Yuxiang Fu"
    zh: "傅玉祥"

directions:
  - title:
      en: "RISC-V processor architecture"
      zh: "RISC-V 处理器架构"
    summary:
      en: "Processor microarchitecture, RTL design, and system-level evaluation."
      zh: "处理器微架构、RTL 设计与系统级评估。"
  - title:
      en: "Memory-centric computing and 3D integration"
      zh: "存算融合与三维集成"
    summary:
      en: "Processing-in-memory and cross-die memory hierarchies for data-intensive workloads."
      zh: "面向数据密集型负载的存算一体架构与跨裸片存储层次。"
  - title:
      en: "Hardware–software co-design for edge inference"
      zh: "面向边缘推理的软硬件协同"
    summary:
      en: "Co-designing model compression, dataflow, and accelerator hardware for efficient inference, with FPGA validation."
      zh: "协同设计模型压缩、数据流与加速器硬件，并通过 FPGA 验证推理系统。"

